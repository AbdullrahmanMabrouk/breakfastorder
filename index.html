<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Lunch Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">TEAM FOOD</div>
        <h1>Lunch Board</h1>
        <p class="subtitle">See everyone’s food plans in one place.</p>
      </div>
      <div class="header-actions">
        <button id="manageTeamBtn" class="ghost-btn" type="button">Manage team</button>
        <button id="copySummaryBtn" class="secondary-btn" type="button">Copy order</button>
      </div>
    </header>

    <main>
      <section class="day-panel">
        <button id="prevDayBtn" class="icon-btn" aria-label="Previous day" type="button">‹</button>
        <div class="date-picker-wrap">
          <div class="section-label">PLAN FOR</div>
          <input id="datePicker" type="date" aria-label="Plan date" />
          <button id="todayBtn" class="today-link" type="button">Today</button>
        </div>
        <button id="nextDayBtn" class="icon-btn" aria-label="Next day" type="button">›</button>
      </section>

      <section id="stats" class="stats-grid" aria-live="polite"></section>

      <section class="your-order-card">
        <div class="card-heading-row">
          <div>
            <div class="section-label">YOUR PLAN</div>
            <h2 id="yourNameTitle">Choose your name</h2>
          </div>
          <span id="saveState" class="save-state">Not saved</span>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>Name</span>
            <select id="memberSelect"></select>
          </label>

          <label class="toggle-row">
            <span>
              <strong>I’m ordering food</strong>
              <small>Turn this off if you’re bringing food or skipping today.</small>
            </span>
            <input id="orderingToggle" type="checkbox" />
          </label>

          <label class="field wide-field">
            <span>What are you eating?</span>
            <input id="mealInput" type="text" maxlength="160" placeholder="e.g. Shawerma + fries" />
          </label>

          <label class="field wide-field">
            <span>Note <em>optional</em></span>
            <input id="noteInput" type="text" maxlength="160" placeholder="e.g. no onions, extra sauce" />
          </label>
        </div>

        <button id="saveBtn" class="primary-btn" type="button">Save my plan</button>
        <div id="formMessage" class="form-message" role="status"></div>
      </section>

      <section class="board-section">
        <div class="section-heading">
          <div>
            <div class="section-label">EVERYONE</div>
            <h2>Today’s board</h2>
          </div>
          <button id="refreshBtn" class="ghost-btn" type="button">Refresh</button>
        </div>
        <div id="board" class="board-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <span>Lunch Board</span>
      <span id="connectionState">Connecting…</span>
    </footer>
  </div>

  <div id="teamModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="teamModalTitle">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="section-label">SETUP</div>
          <h2 id="teamModalTitle">Team members</h2>
        </div>
        <button id="closeTeamBtn" class="icon-btn small" type="button" aria-label="Close">×</button>
      </div>
      <p class="modal-copy">Add everyone who should appear on the daily board. You only need to do this once.</p>
      <div class="add-member-row">
        <input id="newMemberInput" type="text" maxlength="60" placeholder="Coworker name" />
        <button id="addMemberBtn" class="primary-btn" type="button">Add</button>
      </div>
      <div id="teamList" class="team-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
